<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Infinite Arcade Pong</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="game-container">
    <div id="screen-game" class="screen">
      <canvas id="game-board" width="480" height="360"></canvas>
    </div>

    <div id="screen-gameover" class="screen screen-gameover hidden">
      <div class="gameover-icons">
        <button id="mute-btn" class="icon-btn" aria-label="Mute">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
        </button>
        <button id="gear-btn" class="icon-btn" aria-label="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
      <h1 class="game-title neon-glow">Infinite Arcade Pong</h1>
      <h2 class="gameover-heading">Game Over</h2>
      <div class="gameover-scores">
        <div class="gameover-score-row">
          <span class="gameover-score-label">Score</span>
          <span class="gameover-score-value" id="gameover-score">0</span>
        </div>
        <div class="gameover-score-row">
          <span class="gameover-score-label">Highscore</span>
          <span class="gameover-score-value" id="gameover-highscore">0</span>
        </div>
      </div>
      <button id="play-btn" class="btn-pill neon-glow">Play</button>
    </div>

    <div id="screen-settings" class="screen screen-settings hidden">
      <button id="back-btn" class="icon-btn back-btn" aria-label="Back">&larr;</button>
      <h2 class="settings-heading">Settings</h2>

      <div class="settings-section">
        <h3 class="settings-label">Control</h3>
        <div class="settings-buttons">
          <button class="option-btn" data-control-scheme="keyboard">Up &amp; Down Arrow Key</button>
          <button class="option-btn" data-control-scheme="mouse">Mouse</button>
        </div>
      </div>

      <div class="settings-section">
        <h3 class="settings-label">Difficulty</h3>
        <div class="settings-buttons settings-buttons-difficulty">
          <button class="option-btn" data-difficulty="easy">Easy</button>
          <button class="option-btn" data-difficulty="medium">Medium</button>
          <button class="option-btn" data-difficulty="hard">Hard</button>
          <button class="option-btn option-btn-infinite" data-difficulty="infinite">Infinite</button>
        </div>
      </div>
    </div>

    <div id="status-bar" class="status-bar">
      <div class="status-item" id="score">Score: 0</div>
      <div class="status-item" id="highscore">High Score: 0</div>
      <div class="status-item" id="control">Control: --</div>
      <div class="status-item" id="difficulty">Difficulty: --</div>
    </div>
  </div>

  <script src="lib/jquery.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
