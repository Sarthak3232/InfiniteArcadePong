<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Infinite Arcade Pong</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-container">
    <canvas id="game-board" width="480" height="360"></canvas>

    <div id="status-bar" class="status-bar">
      <div class="status-item" id="score">Score: 0</div>
      <div class="status-item" id="highscore">High Score: 0</div>
      <div class="status-item" id="control">Control: --</div>
      <div class="status-item" id="difficulty">Difficulty: --</div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
